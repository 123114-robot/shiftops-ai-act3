name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shiftflow
          POSTGRES_USER: shiftflow
          POSTGRES_PASSWORD: shiftflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow -d shiftflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shiftflow:shiftflow_ci@localhost:5432/shiftflow?schema=public
      DATABASE_TESTS: "true"
      JWT_SECRET: ci-only-secret-at-least-32-characters
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run full automated tests
        run: npm test

      - name: Build production bundles
        run: npm run build
