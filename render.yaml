services:
  - type: web
    runtime: static
    name: shiftops-ai-web
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: 'off'
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: node
    name: shiftops-ai-api
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w backend
    startCommand: npm run db:deploy -w backend && npm run db:seed:demo -w backend && npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24.22.0'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_SEED_ENABLED
        value: 'true'
      - key: DEMO_PASSWORD
        sync: false
      - key: AI_MODE
        value: deterministic
      - key: AI_PROVIDER
        value: amd-token-factory
      - key: SHIFTOPS_MAX_WEEKLY_MINUTES
        value: '2400'
      - key: SHIFTOPS_REQUIRE_ROLE_MATCH
        value: 'true'
